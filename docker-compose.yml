services:
  postgres:
    image: postgres:16
    container_name: downtimeprod-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: downtimeprod_db
      POSTGRES_USER: downtimeprodADM
      POSTGRES_PASSWORD: adm-231331Z

    ports:
      - "5432:5432"

    volumes:
      - downtimeprod_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U downtimeprod -d downtimeprod_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  downtimeprod_postgres_data:
